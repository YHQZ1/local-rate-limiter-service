# Scrape every 5 s so dashboards react within seconds. A production setup would
# use the default 15 s or more.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The ratelimiter pods. Prometheus asks the Kubernetes API which pods exist, so
  # pods that appear or disappear during a rollout are picked up automatically.
  - job_name: ratelimiter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [ratelimiter]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app_kubernetes_io_name]
        regex: ratelimiter
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http
        action: keep
      # Skip finished and pending pods, but keep Running ones even when they are
      # failing their probes, so a crash-looping pod shows up as up == 0.
      - source_labels: [__meta_kubernetes_pod_phase]
        regex: Running
        action: keep
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
      - source_labels: [__meta_kubernetes_namespace]
        target_label: namespace

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
