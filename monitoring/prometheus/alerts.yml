groups:
  - name: ratelimiter
    rules:
      - alert: RatelimiterTargetDown
        expr: up{job="ratelimiter"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.pod }} is not answering metric scrapes"

      - alert: RatelimiterNoInstances
        expr: absent(up{job="ratelimiter"})
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Prometheus sees no ratelimiter pods at all"

      # 5xx only: a 429 is the limiter doing its job, not a failure.
      - alert: RatelimiterHighErrorRate
        expr: |
          sum(rate(ratelimiter_http_requests_total{code=~"5.."}[1m]))
            / sum(rate(ratelimiter_http_requests_total[1m])) > 0.05
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of requests are failing with 5xx"

      - alert: RatelimiterHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(ratelimiter_http_request_duration_seconds_bucket{path="/check"}[1m]))) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /check is above 100 ms"
