# Stable in-cluster address (ratelimiter.ratelimiter.svc) that load-balances
# across whichever pods are currently Ready.
apiVersion: v1
kind: Service
metadata:
  name: ratelimiter
  namespace: ratelimiter
  labels:
    app.kubernetes.io/name: ratelimiter
    app.kubernetes.io/part-of: ratelimiter
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: ratelimiter
  ports:
    - name: http
      port: 80
      targetPort: http
