---
# Inventory: which machines exist and how to reach them.
#
# This one points at the local lab container (ansible/lab/lab.sh up). To
# target a real server, add a host with its address and login user, e.g.
#
#   ratelimiter-prod-1:
#     ansible_host: 203.0.113.10
#     ansible_user: deploy
#
# and drop the two lab-only SSH options below.
all:
  children:
    ratelimiter:
      hosts:
        rl-node1:
          ansible_host: 127.0.0.1
          ansible_port: 2222
          ansible_user: ansible
          ansible_ssh_private_key_file: "{{ inventory_dir }}/../lab/id_ed25519"
          # Lab only: the container's host key changes every time it is
          # recreated. Do not copy these options to real servers.
          ansible_ssh_common_args: "-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
